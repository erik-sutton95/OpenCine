name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SIMULATED cross-brand harness (swift build and test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      # All five packages are sibling checkouts (../OpenCineCore, ../OpenCineMulticam,
      # ../OpenCineDJI, ../OpenCineNikon, ../OpenCineInsta360), pinned by SHA in
      # opencine-pins.txt and verified. Works only once those remotes exist (owner/URL not final).
      - name: Check out pinned OpenCine packages
        run: scripts/checkout-opencine.sh
      - name: One dependency closure
        run: scripts/check-closure.sh
      - name: Build
        run: swift build --build-tests
      - name: Test (fails on a duplicate class warning)
        shell: bash  # explicit: -o pipefail, so a failing swift test fails the step
        run: |
          swift test 2>&1 | tee test.log
          ! grep -q "implemented in both" test.log
