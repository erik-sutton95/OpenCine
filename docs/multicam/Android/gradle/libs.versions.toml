# Kotlin and coroutines match OpenCineCore/Android (and so the OpenPocketCine catalog), so
# consumers resolve one closure through the included builds.
[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
opencine-core = "0.1.0-SNAPSHOT"

[libraries]
opencine-core = { module = "com.opencapture.opencine:core", version.ref = "opencine-core" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
