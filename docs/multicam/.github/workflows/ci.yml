name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      # OpenCineCore is a sibling checkout at ../OpenCineCore, pinned by SHA in
      # opencine-pins.txt and verified. Works only once the OpenCineCore remote exists
      # (owner/URL not final).
      - name: Check out pinned OpenCineCore
        run: scripts/checkout-opencine.sh
      - name: Build, strict concurrency (warnings are errors)
        run: swift build --build-tests -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
