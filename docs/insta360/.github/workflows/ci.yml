name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      # OpenCineCore is a sibling checkout at ../OpenCineCore, pinned by SHA in
      # opencine-pins.txt and verified. Works only once the OpenCineCore remote exists
      # (owner/URL not final).
      - name: Check out pinned OpenCineCore
        run: scripts/checkout-opencine.sh
      - name: Build
        run: swift build --build-tests
      - name: Test (macOS)
        run: swift test
      # The device branch of LunaWiFi (NEHotspotConfiguration) compiles only for iOS hardware.
      - name: Build for iOS devices
        run: xcodebuild -scheme Insta360Apple -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
  android:
    name: Android shell contract and Luna adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Android/settings.gradle.kts includes ../../OpenCineCore/Android (same pin as Swift).
      - name: Check out pinned OpenCineCore
        run: scripts/checkout-opencine.sh
      - name: Test, lint and assemble
        working-directory: Android
        run: ./gradlew test lint assembleRelease
