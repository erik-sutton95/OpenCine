# Shared platform ownership labels. UI and integrations remain separate.

"area:core":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/OpenCineCore*/**/*"
          - "Android/core/**/*"

"area:media":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/OpenCineMedia/**/*"
          - "Sources/OpenCineFrameIO/**/*"
          - "Android/media/**/*"

"area:ui":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/MonitorUI/**/*"
          - "Sources/MonitorPresentation/**/*"
          - "Sources/OpenCineAppKit/**/*"
          - "Sources/OpenCineCameraControls/**/*"
          - "Android/monitor-ui/**/*"
          - "Android/appkit/**/*"
          - "Android/camera-controls/**/*"

"area:protocol":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/OpenCineDJI*/**/*"
          - "Sources/OpenCineNikon*/**/*"
          - "Sources/Insta360*/**/*"
          - "Android/dji/**/*"
          - "Android/nikon/**/*"
          - "Android/insta360-*/**/*"

"area:ios":
  - changed-files:
      - any-glob-to-any-file:
          - "Sources/OpenCineApple/**/*"
          - "Sources/*Apple/**/*"

"area:android":
  - changed-files:
      - any-glob-to-any-file:
          - "Android/**/*"
          - "Sources/*Android/**/*"
          - "scripts/android-*.sh"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**/*"
          - ".github/**/*"

"area:atlas":
  - changed-files:
      - any-glob-to-any-file:
          - "atlas/**/*"
