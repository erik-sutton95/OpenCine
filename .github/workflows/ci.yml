name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          # Scan this candidate and all its ancestors; unrelated branches have separate reviews.
          args: "detect --source=. --log-opts=HEAD --redact --no-banner --config=.gitleaks.toml"
      - name: Repository hygiene
        run: scripts/check-repository-hygiene.sh
      - name: Sentry release tooling shared by the apps (offline)
        run: bash scripts/sentry/sentry-test.sh
      - name: Spell check
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--no-progress --offline --exclude-path atlas/repos ."
          fail: true
      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      - name: Actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: "-color"

  swift:
    name: Swift package (macOS host tests, iOS builds)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Build, strict concurrency
        run: swift build --build-tests -Xswiftc -strict-concurrency=complete
      # Every listed portable area and its tests remain warning-free. Apple runtime
      # deprecations stay visible in the complete package checks; see the runtime guide.
      - name: Portable areas, strict concurrency, warnings are errors
        run: |
          for target in OpenCineCore OpenCineCoreTestSupport OpenCineMedia OpenCineFrameIO \
            OpenCineMotion OpenCineRelay OpenCineMulticam OpenCineCoreTests \
            OpenCineMediaTests OpenCineFrameIOTests OpenCineMotionTests OpenCineRelayTests \
            OpenCineMulticamTests; do
            swift build --scratch-path "$RUNNER_TEMP/opencine-portable-wae" --target "$target" \
              -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          done
      - name: Test (fails on a duplicate class warning)
        shell: bash  # -o pipefail, so a failing swift test fails the step
        run: |
          # Run the complete strict bundle built above, not the isolated WAE objects.
          # Isolate the four bounded real-I/O cases from unrelated MainActor suites.
          # The five-second fixture deadline and every original assertion remain intact.
          cache_test='heldRealWriteDoesNotBlockAdmissionOrSuccessor'
          swift test --skip-build -Xswiftc -strict-concurrency=complete \
            --filter "$cache_test" 2>&1 | tee test-cache.log
          swift test --skip-build -Xswiftc -strict-concurrency=complete \
            --skip "$cache_test" 2>&1 | tee test.log
          ! grep -q "implemented in both" test-cache.log test.log
      - name: Build MonitorUI (iOS Simulator)
        run: xcodebuild -scheme MonitorUI -destination 'generic/platform=iOS Simulator' build
      - name: Build OpenCineApple (iOS Simulator)
        run: xcodebuild -scheme OpenCineApple -destination 'generic/platform=iOS Simulator' build
      # The optional Sentry adapter is its own package (it alone takes sentry-cocoa) and starts the
      # SDK in its tests, so they run in an iOS simulator rather than the shared macOS test process.
      - name: Test OpenCineSentryApple (iOS Simulator)
        working-directory: Packages/OpenCineSentryApple
        run: |
          set -euo pipefail
          udid="$(xcrun simctl create opencine-sentry "iPhone 16 Pro")"
          trap 'xcrun simctl delete "$udid"' EXIT
          xcodebuild -scheme OpenCineSentryApple -destination "platform=iOS Simulator,id=$udid" test
      # The device branch of LunaWiFi (NEHotspotConfiguration) compiles only for iOS hardware.
      - name: Build Insta360Apple (iOS devices)
        run: xcodebuild -scheme Insta360Apple -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  android:
    name: Android (test, lint, assemble, Vulkan regression)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test, lint and assemble (Kotlin warnings are errors in core, media, multicam)
        run: ./gradlew test lint assembleRelease
      - name: Apps' Gradle plugins (build-logic)
        run: ./gradlew -p build-logic test
      - name: Vulkan present synchronization regression (host CPU)
        working-directory: .
        run: scripts/android-vulkan-sync-test.sh
      - name: Release dex check for reflectively created ML Kit components
        working-directory: .
        run: scripts/android-verify-component-registrars-test.sh

  atlas:
    # Nothing here builds an app, writes to another repository, publishes, schedules or merges.
    # It reads the public app repositories for the duplication check. The Graphify build test
    # and the pinned-path eval test skip without app checkouts and report as skipped, not passed.
    name: Atlas check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s atlas/tests -v
      - name: Registry, direction, cycles, snapshots, candidates and private paths
        run: python3 atlas/tools/atlas.py check
      # Informational: consumer builds (`compat run`) need macOS, Xcode and the Android SDK.
      - name: Candidate consumer matrix
        run: python3 atlas/tools/atlas.py compat plan
      # SHELL-00: code copied between OpenCine and the apps may only shrink. Each app is read at
      # the commit its registry ref pins. Best effort: a private app (no token here) or a commit
      # not on GitHub yet is reported by the next step as not checked, never as zero.
      - name: App sources for the duplication check
        continue-on-error: true
        env:
          OPENCAPTURE_WORKSPACE: ${{ runner.temp }}/ws
          GIT_TERMINAL_PROMPT: "0"
        run: mkdir -p "$OPENCAPTURE_WORKSPACE" && python3 atlas/tools/atlas.py ensure
      - name: Duplicated code (no growth against atlas/compat/dupes-baseline.json)
        env:
          OPENCAPTURE_WORKSPACE: ${{ runner.temp }}/ws
        run: python3 atlas/tools/atlas.py dupes --check --top 3

  # The conformance kit's own checks (docs/conformance/SCENARIOS.md): the hosted accessibility walk's
  # self-test and the native view tests that use it, on a private simulator with accessibility on.
  kit-ios:
    name: Conformance kit, iOS (hosted walk self-test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install the SIMULATED application host generator
        run: brew install xcodegen
      - name: Create a private simulator with accessibility enabled
        run: |
          mkdir -p "$RUNNER_TEMP/kit-ios"
          udid=$(scripts/ios-private-simulator.py create "opc-kit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --report "$RUNNER_TEMP/kit-ios/simulator-setup.json")
          echo "KIT_IOS_DEVICE_ID=$udid" >> "$GITHUB_ENV"
      - name: Hosted walk self-test and native view tests
        run: |
          xcodebuild -scheme OpenCine-Package -destination "platform=iOS Simulator,id=$KIT_IOS_DEVICE_ID" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/kit-ios/kit.xcresult" \
            -only-testing:OpenCineHostedAccessibilityTests -only-testing:MonitorUITests \
            -skip-testing:MonitorUITests/MonitorCommandDashboardTests test
      # Scroll accessibility needs an application scene. This runner executes every dashboard
      # contract, including the original activation/read-only assertions, without skipping one.
      - name: Command dashboard contracts in a SIMULATED application host
        timeout-minutes: 20
        run: |
          python3 scripts/ios-command-dashboard-hosted-test.py --simulator-id "$KIT_IOS_DEVICE_ID" \
            --derived-data "$RUNNER_TEMP/kit-ios-dashboard-dd" --output "$RUNNER_TEMP/kit-ios/dashboard"
      - name: Native playback labels and confirmation input
        run: |
          python3 scripts/ios-playback-label-hosted-test.py --simulator-id "$KIT_IOS_DEVICE_ID" \
            --derived-data "$RUNNER_TEMP/kit-ios-labels-dd" --output "$RUNNER_TEMP/kit-ios/playback-labels"
      - name: Delete the private simulator
        if: always()
        run: if [ -n "${KIT_IOS_DEVICE_ID:-}" ]; then scripts/ios-private-simulator.py delete "$KIT_IOS_DEVICE_ID"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kit-ios-evidence
          path: ${{ runner.temp }}/kit-ios
          if-no-files-found: warn

  # The original three-case fixture remains required in kit-ios. This separate standard UI
  # target exercises the typed system-dismissal counterpart with the same shared screen.
  playback-native-ios:
    name: Playback labels, native typed cancellation (SIMULATED)
    needs: kit-ios
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Admit actual private userdata, cache, temporary and output filesystems
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'playback-native'
          output.mkdir()
          paths = [output, Path.home() / 'Library/Developer/CoreSimulator/Devices',
                    Path.home() / 'Library/Caches/org.swift.swiftpm', Path(os.environ['TMPDIR'])]
          facts = {}
          for path in paths:
              existing = path
              while not existing.exists():
                  existing = existing.parent
              stat = os.statvfs(existing)
              facts[str(path)] = {'resolved': str(path.resolve()), 'freeBytes': stat.f_bavail * stat.f_frsize}
          (output / 'admission.json').write_text(json.dumps(facts, indent=2) + '\n')
          assert all(value['freeBytes'] >= 20 * 2**30 for value in facts.values()), facts
          PY
      - name: Create the owned native playback simulator
        run: |
          name="opc-playback-labels-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          udid=$(scripts/ios-private-simulator.py create "$name" \
            --report "$RUNNER_TEMP/playback-native/simulator-setup.json")
          echo "PLAYBACK_UI_DEVICE_ID=$udid" >> "$GITHUB_ENV"
          echo "PLAYBACK_UI_DEVICE_NAME=$name" >> "$GITHUB_ENV"
      - name: Standard native UI target and actual callback settlement
        run: |
          python3 scripts/ios-playback-label-ci.py --run --simulator-id "$PLAYBACK_UI_DEVICE_ID" \
            --expected-device-name "$PLAYBACK_UI_DEVICE_NAME" --output "$RUNNER_TEMP/playback-native/case"
      - name: Retain the exact private simulator in Shutdown state
        if: always()
        shell: bash
        run: |
          if [ -n "${PLAYBACK_UI_DEVICE_ID:-}" ]; then
            python3 scripts/ios-playback-label-ci.py --cleanup --simulator-id "$PLAYBACK_UI_DEVICE_ID" \
              --expected-device-name "$PLAYBACK_UI_DEVICE_NAME" --output "$RUNNER_TEMP/playback-native/case"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playback-native-evidence
          path: ${{ runner.temp }}/playback-native
          if-no-files-found: warn

  # SHELL-05: an app fresh from `atlas new-app` builds against this commit and passes its SIMULATED
  # contract test (OpenCine's fake integration; no camera, no hardware).
  template-ios:
    name: New-app template, iOS (SIMULATED)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Generate Debug/Release apps and prove the full operator flow on a private simulator
        env:
          OUT: ${{ runner.temp }}/template
        run: brew install xcodegen && scripts/template-app-check.sh ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: SIMULATED-template-ios-evidence
          path: |
            ${{ runner.temp }}/template
            !${{ runner.temp }}/template/acceptance/DerivedData/**
            !${{ runner.temp }}/template/acceptance/CompanionDerivedData/**

  template-android:
    name: New-app template, Android (SIMULATED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Allow this ephemeral CI runner to use emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo setfacl -m u:"$(id -un)":rw /dev/kvm; fi
      - name: Generate, test, build Debug/Release and prove the installed full operator flow
        env:
          OUT: ${{ runner.temp }}/template
          TEMPLATE_EMULATOR: "1"
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          scripts/template-app-check.sh android
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: SIMULATED-template-android-evidence
          path: |
            ${{ runner.temp }}/template
            !${{ runner.temp }}/template/acceptance/avd/**

  gate:
    name: CI gate
    if: always()
    needs: [meta, swift, android, atlas, kit-ios, playback-native-ios, template-ios, template-android]
    runs-on: ubuntu-latest
    steps:
      - name: Require every shared and template check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "::error::a required OpenCine job reported '$result'"
              exit 1
            fi
          done
          echo "All OpenCine jobs passed: $RESULTS"
