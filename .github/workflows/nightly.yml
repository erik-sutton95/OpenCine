name: Nightly

# The full suite on main every night: the PR tier plus the hosted simulator, SIMULATED and
# quarantined suites (docs/testing/CI.md). A failure opens or updates the one
# "Nightly CI failing on main" issue (label ci-nightly); the next passing night closes it.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # GitHub can start a scheduled run hours late (2026-10-20: 07:50 to 09:38 UTC for 02:30 to 04:45
  # crons). A late nightly would take the daytime macOS runners from pull requests, so the cron is in the
  # evening (UTC) and a scheduled run that starts between 07:00 and 18:59 UTC skips; manual dispatch
  # always runs. (A 02:30 cron started 5 to 7 hours late every day and always skipped.)
  window:
    name: Night window
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$(date -u +%H)
          if [ "$EVENT" = schedule ] && [ "$hour" -ge 7 ] && [ "$hour" -lt 19 ]; then
            echo "::notice::scheduled nightly started at ${hour}:xx UTC, outside the 19:00-06:59 UTC window; skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  suite:
    name: Full suite
    needs: window
    if: needs.window.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  report:
    name: Tracking issue
    needs: [window, suite]
    if: always() && needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open, update or close the nightly tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_RESULT: ${{ needs.suite.result }}
          # Whole jobs in QUARANTINE (docs/testing/CI.md); they keep their own issues.
          QUARANTINED_JOBS: |
            Playback labels, native typed cancellation (SIMULATED)
        run: scripts/ci-nightly-report.sh
