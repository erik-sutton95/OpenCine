name: Nightly

# The full suite on main every night: the PR tier plus the hosted simulator, SIMULATED and
# quarantined suites (docs/testing/CI.md). A failure opens or updates the one
# "Nightly CI failing on main" issue (label ci-nightly); the next passing night closes it.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    name: Full suite
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  report:
    name: Tracking issue
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open, update or close the nightly tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_RESULT: ${{ needs.suite.result }}
          # Whole jobs in QUARANTINE (docs/testing/CI.md); they keep their own issues.
          QUARANTINED_JOBS: |
            Playback labels, native typed cancellation (SIMULATED)
        run: scripts/ci-nightly-report.sh
